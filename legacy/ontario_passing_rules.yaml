ruleset: Ontario passing rules
source:
  title: The Official Ministry of Transportation (MTO) Driver's Handbook (ontario.ca)
  edition: online edition, scraped to local HTML by scrape_mto_handbook.py on 2026-10-06
  base_dir: handbooks/mto
  online_base: https://www.ontario.ca/document/official-mto-drivers-handbook
  citation: href is <page>.html#<section-id>, relative to base_dir. <page> is the page's slug on ontario.ca (online_base/<page>),
    and <section-id> is the id of the nearest h2 heading; lower headings have no ids and appear only in location.
    diagram_href is the section the diagram sits in, and diagram_image its image file, relative to base_dir.
vocabulary:
- term: PASS
  definition: The manoeuvre of changing lanes to move past a slower vehicle travelling in the same direction, then
    returning to the ORIGINAL LANE. Used interchangeably with ‘overtake’.
  basis: 'changing-positions.html#passing: “Passing is changing lanes to move past a slower vehicle.”'
- term: PASSER
  definition: The driver making a PASS. Unless a rule says otherwise, this is the ACTOR.
  basis: Defined for this rule set
- term: PASSED VEHICLE / PASSED DRIVER
  definition: The vehicle, and its driver, being overtaken.
  basis: Defined for this rule set
- term: DRIVER
  definition: Any driver, whether passing or not.
  basis: Defined for this rule set
- term: ORIGINAL LANE
  definition: The lane the PASSER was in before the PASS began.
  basis: 'changing-positions.html#passing: “Go back to your original lane.”'
- term: PASSING LANE
  definition: 'In the steps for a PASS: the lane the PASSER moves into. As a road feature: an extra lane provided
    so faster traffic can pass (see CLIMBING LANE).'
  basis: changing-positions.html#passing, changing-positions.html#passing-and-climbing-lanes
- term: CLIMBING LANE
  definition: An extra right-hand lane, often on grades, that lets slower vehicles move right so faster ones can
    pass in the left lane.
  basis: changing-positions.html#passing-and-climbing-lanes, Diagram 2-48 (changing-positions.html#passing-and-climbing-lanes)
- term: TRUCK PASSING LANE
  definition: 'On roads with three or more lanes each way where trucks are barred from the far-left lane: the lane
    next to it.'
  basis: changing-positions.html#passing
- term: CENTRE LINE
  definition: The marking separating opposing traffic. Yellow lines separate opposing traffic; white lines separate
    traffic in the same direction.
  basis: pavement-markings.html
- term: SOLID LINE / BROKEN LINE
  definition: A continuous or dashed pavement line at the left of the PASSER's lane.
  basis: pavement-markings.html, Diagram 3-2 (pavement-markings.html), Diagram 3-3 (pavement-markings.html)
- term: MULTI-LANE ROAD
  definition: A road with two or more lanes in the same direction.
  basis: changing-positions.html#changing-lanes
- term: ONE-WAY ROAD
  definition: A road on which all traffic travels in one direction.
  basis: changing-positions.html#passing-on-the-right
- term: SHOULDER
  definition: The strip beside the travelled lanes, paved or unpaved.
  basis: changing-positions.html#passing-on-the-shoulder
- term: ONCOMING TRAFFIC
  definition: Traffic approaching in the opposite direction.
  basis: changing-positions.html#passing
- term: CLEAR DISTANCE
  definition: Unobstructed road ahead that is long enough to complete a PASS safely.
  basis: changing-positions.html#passing
- term: ALONGSIDE
  definition: The phase of a PASS when the PASSER is level with the PASSED VEHICLE.
  basis: changing-positions.html#passing-at-night
- term: BLIND SPOT
  definition: Area around the vehicle not visible in the mirrors; checked by looking over the shoulder.
  basis: changing-positions.html#changing-lanes
- term: PEDESTRIAN CROSSOVER
  definition: A designated crossing without traffic lights, marked by signs, overhead yellow lights, and double
    white lines with an X in each lane.
  basis: stopping.html#stopping-for-pedestrian-crossovers, pavement-markings.html
- term: CROSSWALK
  definition: The part of a roadway linking sidewalks, or marked by signs or lines for pedestrian crossing, marked
    or not.
  basis: sharing-road-other-road-users.html#sharing-the-road-with-pedestrians
- term: CYCLIST
  definition: A person riding a bicycle.
  basis: sharing-road-other-road-users.html#sharing-the-road-with-cyclists
- term: LARGE VEHICLE
  definition: A large commercial vehicle, such as a truck, tractor-trailer or bus.
  basis: sharing-road-other-road-users.html#sharing-the-road-with-large-commercial-vehicles
- term: LCV
  definition: 'Long commercial vehicle: a double trailer up to 40 metres long, identified by a rear placard.'
  basis: signs.html#other-signs
- term: SLOW-MOVING VEHICLE SIGN
  definition: An orange triangle with a red border meaning the vehicle travels at 40 km/h or less.
  basis: sharing-road-other-road-users.html#sharing-the-road-with-farm-machinery, signs.html#other-signs
- term: EMERGENCY VEHICLE
  definition: A police, fire, ambulance or public-utility emergency vehicle using red or blue flashing lights, siren,
    bell, or alternating white high beams.
  basis: dealing-particular-situations.html#emergency-vehicles
- term: SCHOOL BUS
  definition: A chrome-yellow bus marked ‘School Bus’.
  basis: stopping.html#stopping-for-school-buses
- term: MEDIAN
  definition: A physical barrier (raised, lowered, earth or paved strip) separating opposing traffic that vehicles
    cannot cross.
  basis: stopping.html#stopping-for-school-buses
- term: STREETCAR
  definition: A rail transit vehicle running on the road.
  basis: changing-positions.html#passing-on-the-right, changing-positions.html#passing-streetcars
- term: FREEWAY
  definition: A high-speed, controlled-access highway.
  basis: freeway-driving.html
rules:
- id: PASS-GEN-01
  group: GEN
  title: Pass only when it is safe
  force: INSTRUCTION
  modal: MUST NOT
  actor: PASSER
  when: any PASS is contemplated
  action: begin the PASS
  unless: the PASSER is sure the PASS can be completed without danger to the PASSER or others
  statement: WHEN any PASS is contemplated, the PASSER MUST NOT begin the PASS, UNLESS the PASSER is sure the PASS
    can be completed without danger to the PASSER or others.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Passing
    href: changing-positions.html#passing
    quote: Never overtake and pass another vehicle unless you are sure you can do so without danger to yourself
      or others.
- id: PASS-GEN-02
  group: GEN
  title: If in doubt, do not pass
  force: INSTRUCTION
  modal: MUST NOT
  actor: PASSER
  when: the PASSER is in doubt about whether a PASS is safe
  action: begin the PASS
  statement: WHEN the PASSER is in doubt about whether a PASS is safe, the PASSER MUST NOT begin the PASS.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Passing
    href: changing-positions.html#passing
    quote: If in doubt, do not pass.
- id: PASS-GEN-03
  group: GEN
  title: Space and time to complete
  force: INSTRUCTION
  modal: MUST
  actor: PASSER
  when: about to begin a PASS
  action: confirm there is enough space and time to complete the PASS safely
  statement: WHEN about to begin a PASS, the PASSER MUST confirm there is enough space and time to complete the
    PASS safely.
  sources:
  - location: Safe and Responsible Driving › Changing positions
    href: changing-positions.html
    quote: Before beginning, be sure you have enough space and time to complete the move safely.
- id: PASS-GEN-04
  group: GEN
  title: Keep right except to pass
  force: INSTRUCTION
  modal: MUST
  actor: DRIVER
  when: driving on any road
  action: keep to the right of the road, or in the right-hand lane of a MULTI-LANE ROAD
  unless: the DRIVER is turning left or making a PASS
  statement: WHEN driving on any road, the DRIVER MUST keep to the right of the road, or in the right-hand lane
    of a MULTI-LANE ROAD, UNLESS the DRIVER is turning left or making a PASS.
  sources:
  - location: Safe and Responsible Driving › Driving along › Keep right
    href: driving-along.html#keep-right
    quote: Keep to the right of the road or in the right-hand lane on multi-lane roads unless you want to turn left
      or pass another vehicle.
  note: The handbook adds that this is especially important when driving more slowly than other vehicles.
- id: PASS-PROC-01
  group: PROC
  title: Signal left and check before moving out
  force: INSTRUCTION
  modal: MUST
  actor: PASSER
  when: preparing to move into the PASSING LANE
  action: activate the left-turn signal AND check that the way is clear ahead and behind
  statement: WHEN preparing to move into the PASSING LANE, the PASSER MUST activate the left-turn signal AND check
    that the way is clear ahead and behind.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Passing › steps for passing, step 1
    href: changing-positions.html#passing
    quote: Use your left-turn signal to show that you want to pass and check that the way is clear ahead and behind
      before moving into the passing lane.
- id: PASS-PROC-02
  group: PROC
  title: Lane-change checks apply to a pass
  force: INSTRUCTION
  modal: MUST
  actor: PASSER
  when: moving out of, or back into, the ORIGINAL LANE (a PASS begins and ends with a lane change)
  action: check mirrors for a safe gap, check the BLIND SPOT over the shoulder, signal, check again, then steer
    gradually into the new lane without slowing down
  statement: WHEN moving out of, or back into, the ORIGINAL LANE (a PASS begins and ends with a lane change), the
    PASSER MUST check mirrors for a safe gap, check the BLIND SPOT over the shoulder, signal, check again, then
    steer gradually into the new lane without slowing down.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Changing lanes
    href: changing-positions.html#changing-lanes
    quote: Steer gradually into the new lane. Do not slow down, maintain the same speed or gently increase it.
    diagram: Diagram 2-45
    diagram_href: changing-positions.html#changing-lanes
    diagram_image: images/2-35.jpg
    diagram_content: 'Shows a five-stage lane change labelled: "Check for safe space gap", "Check blind spot and
      signal", "Check again", "Make gradual change", "Make sure signal is off".'
  - location: Safe and Responsible Driving › Changing positions
    href: changing-positions.html
    quote: Changing your position on the road involves changing lanes or overtaking and passing another vehicle.
  note: Linking the lane-change steps to passing is an inference from the handbook placing both under ‘Changing
    positions’ and defining passing as ‘changing lanes’.
- id: PASS-PROC-03
  group: PROC
  title: Watch for hidden and entering road users
  force: INSTRUCTION
  modal: MUST
  actor: PASSER
  when: a PASS is under way
  action: watch for bicycles and small vehicles hidden in front of the PASSED VEHICLE, vehicles turning left in
    front, and vehicles or pedestrians entering from another road or driveway
  statement: WHEN a PASS is under way, the PASSER MUST watch for bicycles and small vehicles hidden in front of
    the PASSED VEHICLE, vehicles turning left in front, and vehicles or pedestrians entering from another road or
    driveway.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Passing › steps for passing, step 2
    href: changing-positions.html#passing
    quote: Watch for bicycles and small vehicles that may be hidden from view in front of the vehicle you are about
      to pass.
- id: PASS-PROC-04
  group: PROC
  title: Signal before changing lanes
  force: INSTRUCTION
  modal: MUST NOT
  actor: PASSER
  when: making any lane change that is part of a PASS
  action: change lanes before signalling
  statement: WHEN making any lane change that is part of a PASS, the PASSER MUST NOT change lanes before signalling.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Passing › steps for passing, step 3
    href: changing-positions.html#passing
    quote: Change lanes only after signalling.
- id: PASS-PROC-05
  group: PROC
  title: Return-to-lane point
  force: INSTRUCTION
  modal: MUST
  actor: PASSER
  when: the PASSER has overtaken the PASSED VEHICLE
  action: signal the move back AND return to the ORIGINAL LANE only once the entire front of the PASSED VEHICLE
    is visible in the inside (rear-view) mirror
  statement: WHEN the PASSER has overtaken the PASSED VEHICLE, the PASSER MUST signal the move back AND return to
    the ORIGINAL LANE only once the entire front of the PASSED VEHICLE is visible in the inside (rear-view) mirror.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Passing › steps for passing, step 3
    href: changing-positions.html#passing
    quote: when you can see the entire front of the vehicle you are passing in your inside mirror, make the lane
      change.
  - location: Safe and Responsible Driving › Changing positions › Passing
    href: changing-positions.html#passing
    diagram: Diagram 2-46
    diagram_href: changing-positions.html#passing
    diagram_image: images/2-36.jpg
    diagram_content: Shows a car on a two-lane, two-way road leaving its lane across a broken yellow centre line,
      overtaking a slower white car, and returning to its own lane well ahead of it.
- id: PASS-PROC-06
  group: PROC
  title: Do not cut off the passed vehicle
  force: INSTRUCTION
  modal: MUST NOT
  actor: PASSER
  when: returning to the ORIGINAL LANE
  action: cut off the PASSED VEHICLE by moving suddenly in front of it
  statement: WHEN returning to the ORIGINAL LANE, the PASSER MUST NOT cut off the PASSED VEHICLE by moving suddenly
    in front of it.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Passing › steps for passing, step 3
    href: changing-positions.html#passing
    quote: Be careful not to cut off a vehicle by suddenly moving in front of it.
  - location: Keeping Your Driver's Licence › Other ways to lose your licence › Sanctions – dangerous behaviours
    href: other-ways-lose-your-licence.html#sanctions-dangerous-behaviours
    quote: intentionally cutting off another vehicle
  note: Intentionally cutting off another vehicle is listed as aggressive driving.
- id: PASS-PROC-07
  group: PROC
  title: Do not race; abort the pass
  force: INSTRUCTION
  modal: MUST
  actor: PASSER
  when: the PASSED VEHICLE speeds up during the PASS
  action: abandon the PASS AND return to the ORIGINAL LANE rather than race
  statement: WHEN the PASSED VEHICLE speeds up during the PASS, the PASSER MUST abandon the PASS AND return to the
    ORIGINAL LANE rather than race.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Passing › steps for passing, step 4
    href: changing-positions.html#passing
    quote: If the vehicle you are passing speeds up, do not race. Go back to your original lane.
- id: PASS-PROC-08
  group: PROC
  title: Cancel the signal
  force: INSTRUCTION
  modal: MUST
  actor: PASSER
  when: the lane change back into the ORIGINAL LANE is complete
  action: make sure the turn signal is off
  statement: WHEN the lane change back into the ORIGINAL LANE is complete, the PASSER MUST make sure the turn signal
    is off.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Changing lanes
    href: changing-positions.html#changing-lanes
    diagram: Diagram 2-45
    diagram_href: changing-positions.html#changing-lanes
    diagram_image: images/2-35.jpg
    diagram_content: 'Final stage label: "Make sure signal is off".'
  note: 'Diagram-only source: this step appears in the Diagram 2-45 labels but not in the numbered lane-change steps.'
- id: PASS-LOC-01
  group: LOC
  title: 'Pedestrian crossover: 30 m'
  force: REQUIREMENT
  modal: MUST NOT
  actor: PASSER
  when: within 30 metres of a PEDESTRIAN CROSSOVER
  action: pass any vehicle
  statement: WHEN within 30 metres of a PEDESTRIAN CROSSOVER, the PASSER MUST NOT pass any vehicle.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Passing
    href: changing-positions.html#passing
    quote: Passing within 30 metres of a pedestrian crossover is not permitted.
  - location: Safe and Responsible Driving › Stopping › Stopping for pedestrian crossovers
    href: stopping.html#stopping-for-pedestrian-crossovers
    quote: You must not pass any vehicle within 30 metres of a pedestrian crossover.
- id: PASS-LOC-02
  group: LOC
  title: 'Bridge, viaduct or tunnel: 30 m'
  force: REQUIREMENT
  modal: MUST NOT
  actor: PASSER
  when: within 30 metres of a bridge, viaduct or tunnel
  action: pass to the left of the CENTRE LINE
  statement: WHEN within 30 metres of a bridge, viaduct or tunnel, the PASSER MUST NOT pass to the left of the CENTRE
    LINE.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Passing
    href: changing-positions.html#passing
    quote: Passing left of a centreline is not permitted 30 metres from a bridge, viaduct or tunnel.
- id: PASS-LOC-03
  group: LOC
  title: Hills and curves
  force: INSTRUCTION
  modal: MUST NOT
  actor: PASSER
  when: approaching the crest of a hill OR on a curve, where the view of ONCOMING TRAFFIC is obstructed AND there
    is not enough CLEAR DISTANCE ahead
  action: attempt a PASS
  statement: WHEN approaching the crest of a hill OR on a curve, where the view of ONCOMING TRAFFIC is obstructed
    AND there is not enough CLEAR DISTANCE ahead, the PASSER MUST NOT attempt a PASS.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Passing
    href: changing-positions.html#passing
    quote: Don't attempt to pass when approaching the crest of a hill or on a curve where your vision of oncoming
      traffic is obstructed and there is not enough clear distance ahead to pass in safety.
- id: PASS-LOC-04
  group: LOC
  title: Vehicle stopped at a crosswalk
  force: INSTRUCTION
  modal: MUST NOT
  actor: PASSER
  when: a vehicle is stopped at a CROSSWALK
  action: pass the stopped vehicle
  statement: WHEN a vehicle is stopped at a CROSSWALK, the PASSER MUST NOT pass the stopped vehicle.
  sources:
  - location: Safe and Responsible Driving › Sharing the road with other road users › Sharing the road with pedestrians
    href: sharing-road-other-road-users.html#sharing-the-road-with-pedestrians
    quote: Do not pass a vehicle stopped at a crosswalk.
  note: 'Rationale given: a stopped vehicle may be a clue that a pedestrian is crossing.'
- id: PASS-LOC-05
  group: LOC
  title: Centre left-turn lanes
  force: INSTRUCTION
  modal: MUST NOT
  actor: PASSER
  when: a shared centre left-turn lane (used by both directions) is present
  action: use the left-turn lane for passing
  statement: WHEN a shared centre left-turn lane (used by both directions) is present, the PASSER MUST NOT use the
    left-turn lane for passing.
  sources:
  - location: Safe and Responsible Driving › Changing directions › Left-turn lanes
    href: changing-directions.html#left-turn-lanes
    quote: These left-turn lanes are not to be used for passing.
- id: PASS-LOC-06
  group: LOC
  title: Moving snow plows
  force: INSTRUCTION
  modal: MUST NOT
  actor: PASSER
  when: following a moving snow plow (any conditions)
  action: pass the snow plow
  statement: WHEN following a moving snow plow (any conditions), the PASSER MUST NOT pass the snow plow.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Passing
    href: changing-positions.html#passing
    quote: Don't pass moving snow plows under any conditions.
- id: PASS-LOC-07
  group: LOC
  title: Between staggered snow plows
  force: INSTRUCTION
  modal: MUST NOT
  actor: PASSER
  when: several snow plows are staggered across a freeway
  action: pass between them
  statement: WHEN several snow plows are staggered across a freeway, the PASSER MUST NOT pass between them.
  sources:
  - location: Safe and Responsible Driving › Driving at night and in bad weather › Snow plows
    href: driving-night-and-bad-weather.html#snow-plows
    quote: Do not try to pass between them.
  note: 'Reason given: not enough room, and the ridge of wet snow can throw a vehicle out of control.'
- id: PASS-LOC-08
  group: LOC
  title: Fog
  force: INSTRUCTION
  modal: MUST NOT
  actor: PASSER
  when: driving in fog
  action: pass other vehicles, or speed up to pass a slow-moving vehicle
  statement: WHEN driving in fog, the PASSER MUST NOT pass other vehicles, or speed up to pass a slow-moving vehicle.
  sources:
  - location: Safe and Responsible Driving › Driving at night and in bad weather › Fog › Tips for driving safely
      in fog › DO
    href: driving-night-and-bad-weather.html#fog
    quote: Avoid passing, changing lanes and crossing traffic.
  - location: Safe and Responsible Driving › Driving at night and in bad weather › Fog › Tips for driving safely
      in fog › DON'T
    href: driving-night-and-bad-weather.html#fog
    quote: Don't speed up to pass a vehicle moving slowly
  - location: Safe and Responsible Driving › Driving at night and in bad weather › Fog › Tips for driving safely
      in fog › REMEMBER
    href: driving-night-and-bad-weather.html#fog
    quote: Don't pass other vehicles or speed up suddenly.
  note: The DO list uses the softer ‘Avoid passing’ (SHOULD NOT); the REMEMBER list states it absolutely, so the
    stronger form is used.
- id: PASS-LOC-09
  group: LOC
  title: Blowing snow and whiteouts
  force: INSTRUCTION
  modal: MUST NOT
  actor: PASSER
  when: driving in blowing snow or whiteout conditions
  action: attempt to pass a slow-moving vehicle
  statement: WHEN driving in blowing snow or whiteout conditions, the PASSER MUST NOT attempt to pass a slow-moving
    vehicle.
  sources:
  - location: Safe and Responsible Driving › Driving at night and in bad weather › Whiteouts › Tips for driving
      in blowing snow and whiteout conditions › DO
    href: driving-night-and-bad-weather.html#whiteouts
    quote: Avoid passing, changing lanes and crossing traffic.
  - location: Safe and Responsible Driving › Driving at night and in bad weather › Whiteouts › Tips for driving
      in blowing snow and whiteout conditions › DON'T
    href: driving-night-and-bad-weather.html#whiteouts
    quote: Don't attempt to pass a vehicle moving slowly
- id: PASS-MARK-01
  group: MARK
  title: Solid line at left of lane
  force: ADVICE
  modal: SHOULD NOT
  actor: PASSER
  when: there is a SOLID LINE at the left of the PASSER's lane
  action: pass
  statement: WHEN there is a SOLID LINE at the left of the PASSER's lane, the PASSER SHOULD NOT pass.
  sources:
  - location: Traffic Signs and Lights › Pavement markings
    href: pavement-markings.html
    quote: A solid line at the left of your lane means it is unsafe to pass. ('A' should not pass.)
    diagram: Diagram 3-2
    diagram_href: pavement-markings.html
    diagram_image: images/3-2.jpg
    diagram_content: Shows two vehicles marked ‘A’, each with a solid yellow line at the left of its lane.
  note: The handbook words this as ‘unsafe’ / ‘should not’, so it is recorded as ADVICE, not REQUIREMENT. The Highway
    Traffic Act, not the handbook, is the authority on whether it is an offence.
- id: PASS-MARK-02
  group: MARK
  title: Broken line at left of lane
  force: PERMISSION
  modal: MAY
  actor: PASSER
  when: there is a BROKEN LINE at the left of the PASSER's lane AND the way is clear AND enough broken line remains
    ahead to complete the PASS
  action: pass
  statement: WHEN there is a BROKEN LINE at the left of the PASSER's lane AND the way is clear AND enough broken
    line remains ahead to complete the PASS, the PASSER MAY pass.
  sources:
  - location: Traffic Signs and Lights › Pavement markings
    href: pavement-markings.html
    quote: A broken line at the left of your lane means you may pass if the way is clear. ('A' may pass if there
      are enough broken lines ahead to complete the pass safely.)
    diagram: Diagram 3-3
    diagram_href: pavement-markings.html
    diagram_image: images/3-3a.jpg
    diagram_content: Shows two vehicles marked ‘A’ behind trucks; on the left of the diagram, A has a broken yellow
      line at the left of its lane.
- id: PASS-MARK-03
  group: MARK
  title: ‘Do not pass’ sign
  force: REQUIREMENT
  modal: MUST NOT
  actor: PASSER
  when: on a road posted with the ‘Do not pass’ regulatory sign (red circle and slash over two cars)
  action: pass
  statement: WHEN on a road posted with the ‘Do not pass’ regulatory sign (red circle and slash over two cars),
    the PASSER MUST NOT pass.
  sources:
  - location: Traffic Signs and Lights › Signs › Regulatory signs
    href: signs.html#regulatory-signs
    quote: Do not pass on this road.
  - location: Traffic Signs and Lights › Signs › Regulatory signs
    href: signs.html#regulatory-signs
    quote: These signs give a direction that must be obeyed.
- id: PASS-MARK-04
  group: MARK
  title: Pilot or pace vehicle sign
  force: REQUIREMENT
  modal: MUST NOT
  actor: PASSER
  when: following a pilot vehicle or pace vehicle displaying the ‘do not pass – when flashing’ sign
  action: pass that vehicle
  statement: WHEN following a pilot vehicle or pace vehicle displaying the ‘do not pass – when flashing’ sign, the
    PASSER MUST NOT pass that vehicle.
  sources:
  - location: Traffic Signs and Lights › Signs › Temporary condition signs
    href: signs.html#temporary-condition-signs
    quote: Do not pass the pilot vehicle or pace vehicle bearing this sign.
  note: Recorded as REQUIREMENT because it is a sign direction; the sign image reads ‘WHEN FLASHING’.
- id: PASS-MARK-05
  group: MARK
  title: Hazard marker shows passing side
  force: PERMISSION
  modal: MAY
  actor: PASSER
  when: approaching a hazard close to the edge of the road marked by a striped hazard marker
  action: pass the hazard on the side to which the marker's stripes slope down
  statement: WHEN approaching a hazard close to the edge of the road marked by a striped hazard marker, the PASSER
    MAY pass the hazard on the side to which the marker's stripes slope down.
  sources:
  - location: Traffic Signs and Lights › Signs › Warning signs
    href: signs.html#warning-signs
    quote: Hazard close to the edge of the road. The downward lines show the side on which you may safely pass.
- id: PASS-SIDE-01
  group: SIDE
  title: Pass on the left by default
  force: ADVICE
  modal: SHOULD
  actor: PASSER
  when: making any PASS
  action: pass on the left of the PASSED VEHICLE
  unless: a case in PASS-SIDE-02 or PASS-SIDE-04 applies
  statement: WHEN making any PASS, the PASSER SHOULD pass on the left of the PASSED VEHICLE, UNLESS a case in PASS-SIDE-02
    or PASS-SIDE-04 applies.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Passing on the right
    href: changing-positions.html#passing-on-the-right
    quote: Most passing is done on the left.
- id: PASS-SIDE-02
  group: SIDE
  title: When passing on the right is allowed
  force: PERMISSION
  modal: MAY
  actor: PASSER
  when: on a MULTI-LANE ROAD, OR on a ONE-WAY ROAD, OR when overtaking a STREETCAR, OR when overtaking a left-turning
    vehicle
  action: pass on the right
  statement: WHEN on a MULTI-LANE ROAD, OR on a ONE-WAY ROAD, OR when overtaking a STREETCAR, OR when overtaking
    a left-turning vehicle, the PASSER MAY pass on the right.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Passing on the right
    href: changing-positions.html#passing-on-the-right
    quote: You may pass on the right on multi-lane or one-way roads and when overtaking a streetcar or a left-turning
      vehicle.
- id: PASS-SIDE-03
  group: SIDE
  title: No sudden pass on the right
  force: INSTRUCTION
  modal: MUST NOT
  actor: PASSER
  when: driving in the leftmost lane behind a slower vehicle
  action: suddenly change lanes and pass on the right; wait for the slower vehicle to move right
  statement: WHEN driving in the leftmost lane behind a slower vehicle, the PASSER MUST NOT suddenly change lanes
    and pass on the right; wait for the slower vehicle to move right.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Passing on the right
    href: changing-positions.html#passing-on-the-right
    quote: Do not suddenly change lanes and pass on the right; the driver in front may realize you want to pass
      and move to the right at the same time you do.
  note: The handbook also notes that passing on the right can be more dangerous than passing on the left.
- id: PASS-SIDE-04
  group: SIDE
  title: 'Right shoulder: left-turning vehicle only'
  force: PERMISSION
  modal: MAY ONLY
  actor: PASSER
  when: the vehicle ahead is turning left AND the right SHOULDER is paved
  action: drive on the right SHOULDER to pass it
  statement: WHEN the vehicle ahead is turning left AND the right SHOULDER is paved, the PASSER MAY ONLY drive on
    the right SHOULDER to pass it.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Passing on the shoulder
    href: changing-positions.html#passing-on-the-shoulder
    quote: You may drive on the right shoulder only to pass a vehicle turning left and only if the shoulder is paved.
  note: MAY ONLY = permitted in this case and prohibited in every other case.
- id: PASS-SIDE-05
  group: SIDE
  title: Never on the left shoulder
  force: REQUIREMENT
  modal: MUST NOT
  actor: PASSER
  when: making any PASS
  action: pass on the left SHOULDER, whether paved or not
  statement: WHEN making any PASS, the PASSER MUST NOT pass on the left SHOULDER, whether paved or not.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Passing on the shoulder
    href: changing-positions.html#passing-on-the-shoulder
    quote: You may not pass on the left shoulder, paved or not.
- id: PASS-LANE-01
  group: LANE
  title: Passing and climbing lanes
  force: INSTRUCTION
  modal: MUST
  actor: DRIVER
  when: on a two-lane section where a PASSING LANE or climbing lane is provided
  action: keep to the right-hand lane unless making a PASS; faster vehicles pass in the left lane
  statement: WHEN on a two-lane section where a PASSING LANE or climbing lane is provided, the DRIVER MUST keep
    to the right-hand lane unless making a PASS; faster vehicles pass in the left lane.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Passing and climbing lanes
    href: changing-positions.html#passing-and-climbing-lanes
    quote: These lanes let slower vehicles move into the right-hand lane so that faster ones can pass safely in
      the left lane.
    diagram: Diagram 2-48
    diagram_href: changing-positions.html#passing-and-climbing-lanes
    diagram_image: images/2-48a.jpg
    diagram_content: 'Shows a rural road with a climbing lane: a truck in the right-hand lane, a car passing in
      the left lane, and signs at the roadside marking the lane.'
  - location: Traffic Signs and Lights › Signs › Regulatory signs
    href: signs.html#regulatory-signs
    quote: Keep to the right lane except when passing on two-lane sections where climbing or passing lanes are provided.
- id: PASS-LANE-02
  group: LANE
  title: 'End of passing lane: merge'
  force: INSTRUCTION
  modal: MUST
  actor: DRIVER
  when: the lane-ending sign for a PASSING LANE or climbing lane is shown and the DRIVER is in the right-hand lane
  action: begin to merge safely with traffic in the left-hand lane
  statement: WHEN the lane-ending sign for a PASSING LANE or climbing lane is shown and the DRIVER is in the right-hand
    lane, the DRIVER MUST begin to merge safely with traffic in the left-hand lane.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Passing and climbing lanes
    href: changing-positions.html#passing-and-climbing-lanes
    quote: Another sign warns when the lane is ending so drivers in the right-hand lane can begin to merge safely
      with traffic in the left-hand lane.
- id: PASS-LANE-03
  group: LANE
  title: 'Freeway: pass in left lanes, then return right'
  force: INSTRUCTION
  modal: MUST
  actor: DRIVER
  when: driving on a FREEWAY
  action: keep right, use the left lanes for passing, and not stay in the far-left lane after passing
  statement: WHEN driving on a FREEWAY, the DRIVER MUST keep right, use the left lanes for passing, and not stay
    in the far-left lane after passing.
  sources:
  - location: Safe and Responsible Driving › Freeway driving › Driving along a freeway
    href: freeway-driving.html#driving-along-a-freeway
    quote: Traffic should keep to the right, using the left lanes for passing.
  - location: Safe and Responsible Driving › Freeway driving › Driving along a freeway
    href: freeway-driving.html#driving-along-a-freeway
    quote: Use the far left lane of a multi-lane freeway to pass traffic moving slower than the speed limit, but
      don't stay there.
  note: ‘Traffic should keep to the right’ is advice, but ‘don't stay there’ is an instruction, so the stronger
    form is recorded.
- id: PASS-LANE-04
  group: LANE
  title: Trucks on roads with three or more lanes
  force: REQUIREMENT
  modal: MUST NOT
  actor: DRIVER of a large truck
  when: on a high-speed road or FREEWAY with three or more lanes in each direction where trucks are barred from
    the far-left lane
  action: use the far-left lane; the lane to its right is the TRUCK PASSING LANE
  statement: WHEN on a high-speed road or FREEWAY with three or more lanes in each direction where trucks are barred
    from the far-left lane, the DRIVER of a large truck MUST NOT use the far-left lane; the lane to its right is
    the TRUCK PASSING LANE.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Passing
    href: changing-positions.html#passing
    quote: On many high-speed roads with three or more lanes in each direction, trucks are not allowed to drive
      in the far left-hand lane.
  - location: Safe and Responsible Driving › Freeway driving › Driving along a freeway
    href: freeway-driving.html#driving-along-a-freeway
    quote: large trucks cannot travel in the far left lane and must use the lane to the right for passing.
  note: Applies on ‘many’ such roads, not all; the handbook does not say how the restriction is signed.
- id: PASS-NIGHT-01
  group: NIGHT
  title: Extra care at night
  force: ADVICE
  modal: SHOULD
  actor: PASSER
  when: passing at night
  action: pass only if the PASS is necessary and the way is clear, taking extra care
  statement: WHEN passing at night, the PASSER SHOULD pass only if the PASS is necessary and the way is clear, taking
    extra care.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Passing at night
    href: changing-positions.html#passing-at-night
    quote: 'Be very careful when you pass other vehicles at night. If you have to pass and the way is clear, follow
      these steps:'
- id: PASS-NIGHT-02
  group: NIGHT
  title: Low beams when closing from behind
  force: INSTRUCTION
  modal: MUST
  actor: PASSER
  when: at night, approaching a vehicle from behind
  action: use low-beam headlights
  statement: WHEN at night, approaching a vehicle from behind, the PASSER MUST use low-beam headlights.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Passing at night, step 1
    href: changing-positions.html#passing-at-night
    quote: Switch your headlights to low beams as you approach a vehicle from behind.
  - location: Safe and Responsible Driving › Getting ready to drive › Turn on headlights at night and in poor conditions
    href: getting-ready-drive.html#turn-on-headlights-at-night-and-in-poor-conditions
    quote: Use your low beams when you are less than 60 metres behind another vehicle unless you are passing it.
  note: The headlight section (getting-ready-drive.html#turn-on-headlights-at-night-and-in-poor-conditions) exempts
    the moment of passing from the 60-metre low-beam rule, which is consistent with PASS-NIGHT-03.
- id: PASS-NIGHT-03
  group: NIGHT
  title: High beams once alongside
  force: INSTRUCTION
  modal: MUST
  actor: PASSER
  when: at night, the PASSER has signalled, checked mirrors and BLIND SPOT, pulled out, and is ALONGSIDE the PASSED
    VEHICLE
  action: switch on high-beam headlights
  unless: an oncoming vehicle is within 150 metres (see note)
  statement: WHEN at night, the PASSER has signalled, checked mirrors and BLIND SPOT, pulled out, and is ALONGSIDE
    the PASSED VEHICLE, the PASSER MUST switch on high-beam headlights, UNLESS an oncoming vehicle is within 150
    metres (see note).
  sources:
  - location: Safe and Responsible Driving › Changing positions › Passing at night, step 2
    href: changing-positions.html#passing-at-night
    quote: As you move alongside the vehicle you are passing, switch on your high beams.
  - location: Safe and Responsible Driving › Getting ready to drive › Turn on headlights at night and in poor conditions
    href: getting-ready-drive.html#turn-on-headlights-at-night-and-in-poor-conditions
    quote: remember to switch to low beams within 150 metres of an oncoming vehicle.
  note: The UNLESS clause is inferred by combining the passing-at-night steps with the general headlight rule (getting-ready-drive.html#turn-on-headlights-at-night-and-in-poor-conditions);
    the passing-at-night steps do not mention it themselves.
- id: PASS-NIGHT-04
  group: NIGHT
  title: Night return point
  force: INSTRUCTION
  modal: MUST
  actor: PASSER
  when: at night, all of the front of the PASSED VEHICLE is visible in the rear-view mirror
  action: signal AND pull back into the right lane
  statement: WHEN at night, all of the front of the PASSED VEHICLE is visible in the rear-view mirror, the PASSER
    MUST signal AND pull back into the right lane.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Passing at night, step 3
    href: changing-positions.html#passing-at-night
    quote: When you can see all of the front of the vehicle you are passing in your rear view mirror, you are far
      enough ahead to pull back into the right lane. Remember to signal.
- id: PASS-USER-01
  group: USER
  title: 'Cyclists: one metre'
  force: REQUIREMENT
  modal: MUST
  actor: DRIVER of a motor vehicle
  when: passing a CYCLIST
  action: keep at least 1 metre between the vehicle and the CYCLIST, where practical
  penalty: A fine and 2 demerit points (sharing-road-other-road-users.html#sharing-the-road-with-cyclists).
  statement: WHEN passing a CYCLIST, the DRIVER of a motor vehicle MUST keep at least 1 metre between the vehicle
    and the CYCLIST, where practical.
  sources:
  - location: Safe and Responsible Driving › Sharing the road with other road users › Sharing the road with cyclists
    href: sharing-road-other-road-users.html#sharing-the-road-with-cyclists
    quote: When passing a cyclist, drivers of motor vehicles must maintain a minimum distance of one metre, where
      practical between their vehicle and the cyclist.
    diagram: Diagram 2-11
    diagram_href: sharing-road-other-road-users.html#sharing-the-road-with-cyclists
    diagram_image: images/diagram2-11.jpg
    diagram_content: Shows a car beside a cyclist in a lane marked with a bicycle sharrow; a dimension line marks
      ‘1.0 m’ between the car's side and the cyclist.
- id: PASS-USER-02
  group: USER
  title: 'Cyclists: change lanes where possible'
  force: ADVICE
  modal: SHOULD
  actor: PASSER
  when: passing a CYCLIST and another lane is available
  action: change lanes to pass
  statement: WHEN passing a CYCLIST and another lane is available, the PASSER SHOULD change lanes to pass.
  sources:
  - location: Safe and Responsible Driving › Sharing the road with other road users › Sharing the road with cyclists
    href: sharing-road-other-road-users.html#sharing-the-road-with-cyclists
    quote: Whenever possible, you should change lanes to pass.
- id: PASS-USER-03
  group: USER
  title: 'Cyclists: horn'
  force: INSTRUCTION
  modal: MUST NOT
  actor: PASSER
  when: overtaking a CYCLIST
  action: sound the horn unnecessarily; if the horn is needed, tap it quickly and lightly while still some distance
    away
  statement: WHEN overtaking a CYCLIST, the PASSER MUST NOT sound the horn unnecessarily; if the horn is needed,
    tap it quickly and lightly while still some distance away.
  sources:
  - location: Safe and Responsible Driving › Sharing the road with other road users › Sharing the road with cyclists
    href: sharing-road-other-road-users.html#sharing-the-road-with-cyclists
    quote: Do not sound your horn unnecessarily when you are overtaking a cyclist.
- id: PASS-USER-04
  group: USER
  title: Cyclist lane position
  force: PERMISSION
  modal: MAY
  actor: CYCLIST
  when: the lane is too narrow to be shared safely
  action: use any part of the lane to discourage passing
  statement: WHEN the lane is too narrow to be shared safely, the CYCLIST MAY use any part of the lane to discourage
    passing.
  sources:
  - location: Safe and Responsible Driving › Sharing the road with other road users › Sharing the road with cyclists
    href: sharing-road-other-road-users.html#sharing-the-road-with-cyclists
    quote: Discourage passing where the lane is too narrow to be shared safely
  note: A PASSER can expect this behaviour and not treat it as an error by the cyclist.
- id: PASS-USER-05
  group: USER
  title: 'Two-wheelers: no in-lane passing'
  force: INSTRUCTION
  modal: MUST
  actor: PASSER
  when: a motorcycle, bicycle, limited-speed motorcycle or moped is positioned to one side of its lane
  action: pass only by changing lanes; do not take the position as an invitation to pass within the same lane
  statement: WHEN a motorcycle, bicycle, limited-speed motorcycle or moped is positioned to one side of its lane,
    the PASSER MUST pass only by changing lanes; do not take the position as an invitation to pass within the same
    lane.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Passing
    href: changing-positions.html#passing
    quote: Do not take this as an invitation to pass in the same lane. If you do want to pass these vehicles, do
      so by changing lanes.
    diagram: Diagram 2-47
    diagram_href: changing-positions.html#passing
    diagram_image: images/2-36.5.jpg
    diagram_content: Shows a car on a two-lane road moving across the broken yellow centre line to go around a cyclist
      riding in a sharrow-marked lane, then returning.
  note: Diagram 2-47 is not captioned; linking it to this paragraph is an interpretation based on what it shows
    and where it is placed.
- id: PASS-USER-06
  group: USER
  title: Two-wheelers turning left
  force: INSTRUCTION
  modal: MUST NOT
  actor: PASSER
  when: turning left behind a motorcycle, bicycle, limited-speed motorcycle or moped
  action: pull up beside it to turn at the same time; wait for the smaller vehicle to move right before passing
  statement: WHEN turning left behind a motorcycle, bicycle, limited-speed motorcycle or moped, the PASSER MUST
    NOT pull up beside it to turn at the same time; wait for the smaller vehicle to move right before passing.
  sources:
  - location: Safe and Responsible Driving › Changing directions › Left turns
    href: changing-directions.html#left-turns
    quote: Wait for the smaller vehicle to move right before you pass.
- id: PASS-USER-07
  group: USER
  title: 'Large vehicles: no close cut-in'
  force: INSTRUCTION
  modal: MUST NOT
  actor: PASSER
  when: passing a LARGE VEHICLE
  action: cut in closely in front of it; allow more room than for a smaller vehicle
  statement: WHEN passing a LARGE VEHICLE, the PASSER MUST NOT cut in closely in front of it; allow more room than
    for a smaller vehicle.
  sources:
  - location: Safe and Responsible Driving › Sharing the road with other road users › Sharing the road with large
      commercial vehicles
    href: sharing-road-other-road-users.html#sharing-the-road-with-large-commercial-vehicles
    quote: When passing a large vehicle, do not cut in front closely.
  note: 'Related hazard (sharing-road-other-road-users.html#sharing-the-road-with-large-commercial-vehicles): a
    large vehicle''s air turbulence may affect control of your vehicle while passing it.'
- id: PASS-USER-08
  group: USER
  title: Long commercial vehicles
  force: ADVICE
  modal: SHOULD
  actor: PASSER
  when: preparing to pass a vehicle displaying the LCV placard
  action: allow for its extended length (up to 40 metres) and limited speed
  statement: WHEN preparing to pass a vehicle displaying the LCV placard, the PASSER SHOULD allow for its extended
    length (up to 40 metres) and limited speed.
  sources:
  - location: Traffic Signs and Lights › Signs › Other signs › Long commercial vehicle (LCV)
    href: signs.html#other-signs
    quote: anticipate both the extended length and limited speed when preparing to pass one on the highway.
- id: PASS-USER-09
  group: USER
  title: Slow-moving vehicles (farm machinery)
  force: INSTRUCTION
  modal: MUST NOT
  actor: PASSER
  when: following a vehicle with a SLOW-MOVING VEHICLE SIGN
  action: pass until it is safe; stay well back meanwhile
  statement: WHEN following a vehicle with a SLOW-MOVING VEHICLE SIGN, the PASSER MUST NOT pass until it is safe;
    stay well back meanwhile.
  sources:
  - location: Safe and Responsible Driving › Sharing the road with other road users › Sharing the road with farm
      machinery
    href: sharing-road-other-road-users.html#sharing-the-road-with-farm-machinery
    quote: Stay well back and do not pass until it is safe to do so.
- id: PASS-USER-10
  group: USER
  title: Horse-drawn vehicles
  force: INSTRUCTION
  modal: MUST
  actor: PASSER
  when: passing a horse-drawn vehicle
  action: pass only when safe AND leave as much lateral distance as possible
  statement: WHEN passing a horse-drawn vehicle, the PASSER MUST pass only when safe AND leave as much lateral distance
    as possible.
  sources:
  - location: Safe and Responsible Driving › Sharing the road with other road users › Sharing the road with horse-drawn
      vehicles
    href: sharing-road-other-road-users.html#sharing-the-road-with-horse-drawn-vehicles
    quote: When passing, give as much distance between you and them as possible.
  note: 'Reason given: passing too closely can startle the horse into changing direction suddenly.'
- id: PASS-USER-11
  group: USER
  title: Parked vehicles
  force: INSTRUCTION
  modal: MUST
  actor: PASSER
  when: passing parked vehicles
  action: watch for doors suddenly opening, or doors open for loading and unloading
  statement: WHEN passing parked vehicles, the PASSER MUST watch for doors suddenly opening, or doors open for loading
    and unloading.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Passing
    href: changing-positions.html#passing
    quote: When passing parked vehicles, watch carefully for people suddenly opening doors or for doors opened to
      load and unload.
- id: PASS-USER-12
  group: USER
  title: Roadside workers and vehicles
  force: INSTRUCTION
  modal: MUST
  actor: PASSER
  when: passing road workers, roadside-assistance or disabled vehicles, surveyors, or maintenance or utility workers
  action: slow down and pass with caution; if safe, move over a lane
  statement: WHEN passing road workers, roadside-assistance or disabled vehicles, surveyors, or maintenance or utility
    workers, the PASSER MUST slow down and pass with caution; if safe, move over a lane.
  sources:
  - location: Safe and Responsible Driving › Dealing with particular situations › Workers on the road
    href: dealing-particular-situations.html#workers-on-the-road
    quote: Always slow down and pass with caution to prevent a collision. If safe to do so, move over a lane to
      increase the space between your vehicle and the hazard.
- id: PASS-USER-13
  group: USER
  title: Animals
  force: INSTRUCTION
  modal: MUST
  actor: PASSER
  when: an animal is on or near the road
  action: slow down and pass carefully
  statement: WHEN an animal is on or near the road, the PASSER MUST slow down and pass carefully.
  sources:
  - location: Safe and Responsible Driving › Dealing with particular situations › Animals on the road
    href: dealing-particular-situations.html#animals-on-the-road
    quote: If you see an animal on or near the road, slow down and pass carefully
- id: PASS-STOP-01
  group: STOP
  title: 'Stopped emergency vehicle or tow truck: slow down'
  force: REQUIREMENT
  modal: MUST
  actor: PASSER
  when: approaching, in the same direction of travel, a stopped EMERGENCY VEHICLE with red (or red and blue) lights
    flashing, OR a stopped tow truck with amber lights flashing
  action: reduce speed and proceed with caution
  penalty: 'A fine and 3 demerit points for a first offence; higher fines and up to 6 months in jail for further
    offences (dealing-particular-situations.html#reacting-to-a-stopped-emergency-vehicle-or-tow-truck). Table of
    offences: 3 points (keeping-your-drivers-licence.html#table-of-offences).'
  statement: WHEN approaching, in the same direction of travel, a stopped EMERGENCY VEHICLE with red (or red and
    blue) lights flashing, OR a stopped tow truck with amber lights flashing, the PASSER MUST reduce speed and proceed
    with caution.
  sources:
  - location: Safe and Responsible Driving › Dealing with particular situations › Reacting to a stopped emergency
      vehicle or tow truck
    href: dealing-particular-situations.html#reacting-to-a-stopped-emergency-vehicle-or-tow-truck
    quote: you are required to reduce the speed of your vehicle and proceed with caution.
    diagram: Diagram 2-57
    diagram_href: dealing-particular-situations.html#reacting-to-a-stopped-emergency-vehicle-or-tow-truck
    diagram_image: images/diagram2-56.jpg
    diagram_content: Shows a stopped ambulance at the edge of a multi-lane road and a car moving from the lane next
      to it into the next lane over (arrow).
  - location: Keeping Your Driver's Licence › Table of offences › Three points
    href: keeping-your-drivers-licence.html#table-of-offences
    quote: Failing to slow and carefully pass a stopped emergency vehicle
- id: PASS-STOP-02
  group: STOP
  title: 'Stopped emergency vehicle or tow truck: move over'
  force: REQUIREMENT
  modal: MUST
  actor: PASSER
  when: conditions of PASS-STOP-01 apply AND the road has two or more lanes in the PASSER's direction
  action: move into a lane away from the emergency vehicle or tow truck, if safe, changing lanes well in advance
  penalty: 'As PASS-STOP-01. Table of offences: 3 points (keeping-your-drivers-licence.html#table-of-offences).'
  statement: WHEN conditions of PASS-STOP-01 apply AND the road has two or more lanes in the PASSER's direction,
    the PASSER MUST move into a lane away from the emergency vehicle or tow truck, if safe, changing lanes well
    in advance.
  sources:
  - location: Safe and Responsible Driving › Dealing with particular situations › Reacting to a stopped emergency
      vehicle or tow truck
    href: dealing-particular-situations.html#reacting-to-a-stopped-emergency-vehicle-or-tow-truck
    quote: When the roadway has two or more lanes of traffic in the same direction of your travel, you are required
      to move into a lane away from the emergency vehicle or tow truck, if
    diagram: Diagram 2-57
    diagram_href: dealing-particular-situations.html#reacting-to-a-stopped-emergency-vehicle-or-tow-truck
    diagram_image: images/diagram2-56.jpg
    diagram_content: See PASS-STOP-01.
  - location: Keeping Your Driver's Licence › Table of offences › Three points
    href: keeping-your-drivers-licence.html#table-of-offences
    quote: Failing to move, where possible, into another lane when passing a stopped emergency vehicle
- id: PASS-STOP-03
  group: STOP
  title: Stopped school bus
  force: REQUIREMENT
  modal: MUST NOT
  actor: DRIVER
  when: approaching a stopped SCHOOL BUS with its upper red lights flashing or its stop arm out, from behind, OR
    from the front on a road without a MEDIAN
  action: pass the bus; instead the DRIVER stops (at least 20 metres back when behind it, at a safe distance when
    facing it) and stays stopped until the bus moves, or its lights stop flashing and the stop arm folds away
  penalty: 'A heavy fine and 6 demerit points for a first offence (stopping.html#stopping-for-school-buses); the
    registered owner can be given the fines, but not the points (stopping.html#stopping-for-school-buses). Table
    of offences: 6 points (keeping-your-drivers-licence.html#table-of-offences).'
  statement: WHEN approaching a stopped SCHOOL BUS with its upper red lights flashing or its stop arm out, from
    behind, OR from the front on a road without a MEDIAN, the DRIVER MUST NOT pass the bus; instead the DRIVER stops
    (at least 20 metres back when behind it, at a safe distance when facing it) and stays stopped until the bus
    moves, or its lights stop flashing and the stop arm folds away.
  sources:
  - location: Safe and Responsible Driving › Stopping › Stopping for school buses
    href: stopping.html#stopping-for-school-buses
    quote: You must stop whenever you approach a stopped school bus with its upper alternating red lights flashing,
      regardless of whether you are behind the bus or approaching it from the front.
    diagram: Diagram 2-27
    diagram_href: stopping.html#stopping-for-school-buses
    diagram_image: images/2-27a.jpg
    diagram_content: 'Undivided road: the bus is stopped with red lights flashing and children crossing; ‘20 Metres’
      is marked between the bus and the stopped traffic behind it.'
  - location: Safe and Responsible Driving › Stopping › Stopping for school buses
    href: stopping.html#stopping-for-school-buses
    quote: If you are on a road with a median strip, only vehicles coming from behind the bus must stop.
    diagram: Diagram 2-28
    diagram_href: stopping.html#stopping-for-school-buses
    diagram_image: images/2-28a.jpg
    diagram_content: 'Road with a median: traffic behind the bus stopped 20 metres back; oncoming traffic beyond
      the median keeps moving.'
  - location: Safe and Responsible Driving › Stopping › Stopping for school buses
    href: stopping.html#stopping-for-school-buses
    quote: It is illegal to fail to stop for a stopped school bus that has its red lights flashing.
  - location: Safe and Responsible Driving › Stopping › Stopping for school buses
    href: stopping.html#stopping-for-school-buses
    quote: If you don't stop, you can be fined heavily and get six demerit points for a first offence.
  - location: Safe and Responsible Driving › Stopping › Stopping for school buses
    href: stopping.html#stopping-for-school-buses
    quote: If you are the vehicle’s registered owner, these fines, but not demerit points or jail time, may be applied
      to you.
  - location: Keeping Your Driver's Licence › Table of offences › Six points
    href: keeping-your-drivers-licence.html#table-of-offences
    quote: Failing to stop for a school bus
  - location: Safe and Responsible Driving › Sharing the road with other road users › Sharing the road with school
      buses
    href: sharing-road-other-road-users.html#sharing-the-road-with-school-buses
    diagram: Diagram 2-18
    diagram_href: sharing-road-other-road-users.html#sharing-the-road-with-school-buses
    diagram_image: images/mto-school-bus-prepare_to_stop-2-28-en-300x300-2022-06-30-v1.jpg
    diagram_content: 'Amber-light stage: ‘Prepare to stop’ arrow behind the bus on a road with a median.'
  note: The handbook frames this as a duty to STOP; a PASS of a stopped school bus with red lights flashing is therefore
    prohibited. The amber-light stage (sharing-road-other-road-users.html#sharing-the-road-with-school-buses) requires
    slowing and preparing to stop.
- id: PASS-SC-01
  group: SC
  title: Pass streetcars on the right
  force: REQUIREMENT
  modal: MUST
  actor: PASSER
  when: passing a STREETCAR
  action: pass on the right
  unless: the PASSER is driving on a ONE-WAY ROAD
  statement: WHEN passing a STREETCAR, the PASSER MUST pass on the right, UNLESS the PASSER is driving on a ONE-WAY
    ROAD.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Passing streetcars
    href: changing-positions.html#passing-streetcars
    quote: You must pass streetcars on the right unless you are driving on a one-way road.
    diagram: Diagram 2-49
    diagram_href: changing-positions.html#passing-streetcars
    diagram_image: images/2-39.jpg
    diagram_content: Shows a stopped streetcar with passengers getting off toward the curb, and the cars behind
      it on the right stopped back, with a ‘2 Metres’ arrow marking the gap behind the rear doors.
- id: PASS-SC-02
  group: SC
  title: 'Streetcar stops: 2 metres behind the doors'
  force: REQUIREMENT
  modal: MUST
  actor: DRIVER
  when: a STREETCAR is stopped and passengers are getting on or off, AND no separate passenger area (safety island
    or zone) is provided
  action: stay at least 2 metres behind the streetcar's rear doors
  statement: WHEN a STREETCAR is stopped and passengers are getting on or off, AND no separate passenger area (safety
    island or zone) is provided, the DRIVER MUST stay at least 2 metres behind the streetcar's rear doors.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Passing streetcars
    href: changing-positions.html#passing-streetcars
    quote: At streetcar stops, stay at least two metres behind the rear doors where passengers are getting off or
      on.
    diagram: Diagram 2-49
    diagram_href: changing-positions.html#passing-streetcars
    diagram_image: images/2-39.jpg
    diagram_content: See PASS-SC-01.
  note: Recorded as REQUIREMENT because the handbook calls it a ‘rule’ in the next sentence (‘This rule does not
    apply at stops where an area has been set aside...’).
- id: PASS-SC-03
  group: SC
  title: Streetcar safety islands and zones
  force: INSTRUCTION
  modal: MUST
  actor: PASSER
  when: passing a streetcar stop that has a safety island or zone set aside for passengers
  action: pass at a reasonable speed and be ready for pedestrians to move suddenly or unexpectedly
  statement: WHEN passing a streetcar stop that has a safety island or zone set aside for passengers, the PASSER
    MUST pass at a reasonable speed and be ready for pedestrians to move suddenly or unexpectedly.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Passing streetcars
    href: changing-positions.html#passing-streetcars
    quote: Always pass these areas at a reasonable speed and be prepared for pedestrians to make sudden or unexpected
      moves.
  - location: Safe and Responsible Driving › Sharing the road with other road users › Sharing the road with pedestrians
    href: sharing-road-other-road-users.html#sharing-the-road-with-pedestrians
    quote: Pass these safety islands and zones at a reasonable speed.
- id: PASS-BEING-01
  group: BEING
  title: Do not speed up when being passed
  force: REQUIREMENT
  modal: MUST NOT
  actor: PASSED DRIVER
  when: another driver is trying to pass
  action: speed up
  statement: WHEN another driver is trying to pass, the PASSED DRIVER MUST NOT speed up.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Passing › steps for passing, step 4
    href: changing-positions.html#passing
    quote: And do not speed up when another driver is trying to pass you. It is unlawful and dangerous.
- id: PASS-BEING-02
  group: BEING
  title: Move right and let faster traffic pass
  force: INSTRUCTION
  modal: MUST
  actor: PASSED DRIVER
  when: faster traffic wants to pass
  action: move to the right and let it pass safely
  statement: WHEN faster traffic wants to pass, the PASSED DRIVER MUST move to the right and let it pass safely.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Passing
    href: changing-positions.html#passing
    quote: When faster traffic wants to pass you, move to the right and let it pass in safety.
  - location: Your Vehicle › Test yourself - Sample knowledge test questions › question 5 and answer key
    href: test-yourself-sample-knowledge-test-questions.html
    quote: Move to the right and allow such vehicle to pass.
  note: 'Sample test question 5 confirms this as the correct answer (key: 5-d); the wrong options were speeding
    up, moving left, and signalling the other driver not to pass.'
- id: PASS-BEING-03
  group: BEING
  title: Being passed on an undivided road
  force: INSTRUCTION
  modal: MUST
  actor: PASSED DRIVER
  when: on an undivided road, being passed by a driver who has moved into the opposite lane
  action: watch oncoming traffic, move closer to the right side of the lane, and be ready to slow down so the PASSER
    can get in front sooner
  statement: WHEN on an undivided road, being passed by a driver who has moved into the opposite lane, the PASSED
    DRIVER MUST watch oncoming traffic, move closer to the right side of the lane, and be ready to slow down so
    the PASSER can get in front sooner.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Passing
    href: changing-positions.html#passing
    quote: Be prepared to slow down to let the passing driver get in front of you more quickly to prevent a collision.
- id: PASS-BEING-04
  group: BEING
  title: Clear the truck passing lane
  force: INSTRUCTION
  modal: MUST
  actor: PASSED DRIVER
  when: driving in the TRUCK PASSING LANE and a truck wants to pass
  action: move into the right-hand lane as soon as possible
  statement: WHEN driving in the TRUCK PASSING LANE and a truck wants to pass, the PASSED DRIVER MUST move into
    the right-hand lane as soon as possible.
  sources:
  - location: Safe and Responsible Driving › Changing positions › Passing
    href: changing-positions.html#passing
    quote: If you are in this lane and a truck wants to pass, move into the right-hand lane as soon as you can.
- id: PASS-BEING-05
  group: BEING
  title: Do not block a pass
  force: REQUIREMENT
  modal: MUST NOT
  actor: PASSED DRIVER
  when: another vehicle is attempting to pass
  action: drive in a way that prevents the other vehicle from passing
  penalty: Listed under ‘Sanctions – dangerous behaviours’ as aggressive driving (other-ways-lose-your-licence.html#sanctions-dangerous-behaviours);
    no specific penalty is given there.
  statement: WHEN another vehicle is attempting to pass, the PASSED DRIVER MUST NOT drive in a way that prevents
    the other vehicle from passing.
  sources:
  - location: Keeping Your Driver's Licence › Other ways to lose your licence › Sanctions – dangerous behaviours
    href: other-ways-lose-your-licence.html#sanctions-dangerous-behaviours
    quote: driving a motor vehicle to prevent another vehicle from passing
- id: PASS-BEING-06
  group: BEING
  title: Being overtaken by an emergency vehicle
  force: REQUIREMENT
  modal: MUST
  actor: DRIVER
  when: an EMERGENCY VEHICLE approaches from any direction with flashing red (or red and blue) lights, or siren
    or bell sounding
  action: stop immediately, as near as practical to the right-hand curb or edge (on a one-way road or divided highway
    with more than two lanes, the nearest curb or edge), without stopping on the shoulder
  penalty: A fine and 3 demerit points for a first offence (dealing-particular-situations.html#reacting-to-a-stopped-emergency-vehicle-or-tow-truck).
  statement: WHEN an EMERGENCY VEHICLE approaches from any direction with flashing red (or red and blue) lights,
    or siren or bell sounding, the DRIVER MUST stop immediately, as near as practical to the right-hand curb or
    edge (on a one-way road or divided highway with more than two lanes, the nearest curb or edge), without stopping
    on the shoulder.
  sources:
  - location: Safe and Responsible Driving › Dealing with particular situations › Reacting to an approaching emergency
      vehicle
    href: dealing-particular-situations.html#reacting-to-an-approaching-emergency-vehicle
    quote: you are required to bring your vehicle to an immediate stop.
    diagram: Diagram 2-56
    diagram_href: dealing-particular-situations.html#reacting-to-an-approaching-emergency-vehicle
    diagram_image: images/2-46.jpg
    diagram_content: Shows an ambulance with lights on travelling on a multi-lane road while surrounding vehicles
      pull toward the edges.
  note: If already in an intersection preparing to turn, abandon the turn and clear the intersection by going straight,
    because the emergency vehicle may pass on the side you meant to turn toward (dealing-particular-situations.html#reacting-to-an-approaching-emergency-vehicle).
- id: PASS-TOW-01
  group: TOW
  title: Passing while towing
  force: INSTRUCTION
  modal: MUST
  actor: PASSER
  when: towing a trailer AND preparing to make, or completing, a PASS
  action: confirm enough time and room for the slower acceleration and greater length; allow extra room before moving
    back; do not cut back in too soon
  statement: WHEN towing a trailer AND preparing to make, or completing, a PASS, the PASSER MUST confirm enough
    time and room for the slower acceleration and greater length; allow extra room before moving back; do not cut
    back in too soon.
  sources:
  - location: Your Vehicle › Towing › Passing
    href: towing.html#passing
    quote: Before you pass, make sure you have enough time and room to complete the pass.
  note: 'Reason given: cutting back too soon can make the trailer sway.'
- id: PASS-TOW-02
  group: TOW
  title: Holding up traffic while towing
  force: INSTRUCTION
  modal: MUST
  actor: PASSED DRIVER
  when: towing a trailer AND holding up a line of traffic
  action: signal, pull over, and let the other vehicles pass
  statement: WHEN towing a trailer AND holding up a line of traffic, the PASSED DRIVER MUST signal, pull over, and
    let the other vehicles pass.
  sources:
  - location: Your Vehicle › Towing › Being passed
    href: towing.html#being-passed
    quote: If you are holding up a line of traffic, signal, pull over and let the other vehicles pass.
  note: If a large bus or truck passes and its wind pushes the trailer, do not brake; steer back into position (a
    slight increase in speed may help).
