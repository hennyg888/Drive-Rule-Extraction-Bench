<text x="1096" y="194" class="m">passing-rules-*.html</text>
<text x="1096" y="221" class="o">accepted statements</text>
<text x="1096" y="240" class="o">corrections, notes</text>
<rect x="1292" y="118" width="186" height="176" rx="10" fill="#F1EDF9" stroke="#6A4BB0" stroke-width="1.6"/>
<text x="1306" y="146" class="t" fill="#4B3285">7  Reference set</text>
<text x="1306" y="175" class="m">frozen, history in git</text>
<text x="1306" y="202" class="o">Ontario: 88 statements</text>
<text x="1306" y="221" class="o">CA 83, TX 104: drafts</text>
<text x="1306" y="240" class="o">provenance/</text>
<text x="1306" y="259" class="o">SHA256SUMS</text>
