<text x="1096" y="667" class="o">Qwen trials: T2 runs on the Ontario passages,</text>
<text x="1096" y="686" class="o">scored against the reference (qwen/)</text>
<text x="1096" y="705" class="o">Driving VLA: retrieve, ground, check, cite</text>
<path d="M1385.0 296 L1385.0 606" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="1393.0" y="594" class="a" text-anchor="start">rules as context</text>
