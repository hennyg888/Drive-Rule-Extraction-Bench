<rect x="242" y="392" width="340" height="150" rx="10" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="256" y="420" class="t" fill="#1F4E86">C  Census (optional per handbook)</text>
<text x="256" y="449" class="m">segment_sentences.py, make_census_shards.py</text>
<text x="256" y="468" class="m">8 labellers, census-guidelines.md</text>
<text x="256" y="495" class="o">Ontario: 3,444 labelled sentences,</text>
<text x="256" y="514" class="o">type, modal, clauses, vague words</text>
<rect x="706" y="392" width="352" height="150" rx="10" fill="#F1EDF9" stroke="#6A4BB0" stroke-width="1.6"/>
<text x="720" y="420" class="t" fill="#4B3285">L  Rule language, prompt and schema</text>
<text x="720" y="449" class="m">fixed between runs; changes are commits</text>
<text x="720" y="476" class="o">rule-language.md, statements.schema.json</text>
<text x="720" y="495" class="o">prompt: extract-rules.md</text>
<text x="720" y="514" class="o">(one prompt for every handbook)</text>
