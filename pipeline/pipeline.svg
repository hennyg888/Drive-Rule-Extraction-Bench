<svg xmlns="http://www.w3.org/2000/svg" width="1510" height="780" viewBox="0 0 1510 780" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker>
<style>.t{font-size:17px;font-weight:700} .m{font-size:13px;fill:#333} .o{font-size:13.5px;fill:#111} .n{font-size:13px;fill:#555;font-style:italic} .a{font-size:12.5px;fill:#444} .h{font-size:22px;font-weight:700;fill:#111} .s{font-size:14px;fill:#555}</style></defs>
<rect width="1510" height="780" fill="#ffffff"/>
<text x="32" y="40" class="h">Handbook rule extraction pipeline</text>
<text x="32" y="64" class="s">Drive-Rule-Extraction-Bench · current procedure as of 26 October 2026</text>
<rect x="32" y="118" width="186" height="176" rx="10" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.6"/>
<text x="46" y="146" class="t" fill="#1F4E86">1  Acquire</text>
<text x="46" y="175" class="m">scrapers/scrape_&lt;x&gt;_*.py</text>
<text x="46" y="202" class="o">handbooks/&lt;x&gt;/:</text>
<text x="46" y="221" class="o">HTML, images, PDF</text>
<text x="46" y="240" class="n">Ontario, California,</text>
<text x="46" y="259" class="n">Texas: one layout</text>
<rect x="242" y="118" width="186" height="176" rx="10" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="1.6"/>
<text x="256" y="146" class="t" fill="#1F4E86">2  Parse</text>
<text x="256" y="175" class="m">segment_handbook.py</text>
<text x="256" y="202" class="o">block passages with</text>
<text x="256" y="221" class="o">heading path</text>
<text x="256" y="240" class="o">analysis/segments/</text>
<text x="256" y="259" class="n">census: sentences</text>
<rect x="452" y="118" width="186" height="176" rx="10" fill="#EAF6EE" stroke="#2E8B57" stroke-width="3"/>
<text x="466" y="146" class="t" fill="#1E6A40">3  Select passages</text>
<g transform="translate(606,260)" fill="#2E8B57"><circle cx="8" cy="5" r="5"/><path d="M0 22 Q8 8 16 22 Z"/></g>
<text x="466" y="175" class="m">a person (Ontario)</text>
<text x="466" y="194" class="m">select-passages.md</text>
<text x="466" y="221" class="o">passages JSON</text>
<text x="466" y="240" class="o">topic text</text>
<text x="466" y="259" class="n">ON 105, CA 105, TX 145</text>
<rect x="662" y="118" width="186" height="176" rx="10" fill="#EAF6EE" stroke="#2E8B57" stroke-width="1.6"/>
<text x="676" y="146" class="t" fill="#1E6A40">4  Extract</text>
<text x="676" y="175" class="m">extract-rules.md</text>
<text x="676" y="194" class="m">+ any model</text>
<text x="676" y="221" class="o">statements JSON</text>
<text x="676" y="240" class="o">raw output, prompt</text>
<text x="676" y="259" class="o">one folder per run</text>
<rect x="872" y="118" width="186" height="176" rx="10" fill="#EAF6EE" stroke="#2E8B57" stroke-width="1.6"/>
<text x="886" y="146" class="t" fill="#1E6A40">5  Validate, score</text>
<text x="886" y="175" class="m">check_statements.py</text>
<text x="886" y="194" class="m">score_t2.py</text>
<text x="886" y="221" class="o">schema and syntax</text>
<text x="886" y="240" class="o">agreement report</text>
<text x="886" y="259" class="o">hard cases</text>
<rect x="1082" y="118" width="186" height="176" rx="10" fill="#EAF6EE" stroke="#2E8B57" stroke-width="3"/>
<text x="1096" y="146" class="t" fill="#1E6A40">6  Review</text>
<g transform="translate(1236,260)" fill="#2E8B57"><circle cx="8" cy="5" r="5"/><path d="M0 22 Q8 8 16 22 Z"/></g>
