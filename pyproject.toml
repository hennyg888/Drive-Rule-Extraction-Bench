[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drbench"
version = "0.1.0"
description = "Drive-Rule-Extraction-Bench: driver handbooks as a corpus with an id on every block and sentence"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4",
    "pyyaml",
    "pillow",
]

[project.optional-dependencies]
tokens = ["transformers"]   # exact token counts in `build_corpus.py --stats`
dev = ["pytest"]

# The programs at the top level (build_corpus.py) are run from the repository root and import
# drbench from there; `pip install -e .` installs the dependencies.
[tool.setuptools]
packages = ["drbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
